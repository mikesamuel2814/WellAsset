name: Deploy to EC2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build application
        run: |
          # Build frontend
          npx vite build
          
          # Build backend with NODE_ENV=production defined at build time to eliminate dev-only code
          npx esbuild server/index.ts --platform=node --packages=external --bundle --format=esm --minify --define:process.env.NODE_ENV='"production"' --outdir=dist
      
      - name: Create deployment package
        run: |
          # Create deployment directory
          mkdir -p deploy
          
          # Copy necessary files
          cp -r client deploy/
          cp -r server deploy/
          cp -r shared deploy/
          cp -r dist deploy/
          cp package.json package-lock.json deploy/
          cp ecosystem.config.cjs deploy/
          cp deploy.sh deploy/
          cp drizzle.config.ts deploy/
          cp wellasset.service deploy/
          cp start.sh deploy/
          
          # Copy attached assets (images)
          if [ -d "attached_assets" ]; then
            cp -r attached_assets deploy/
          fi
          
          # Copy migrations directory if it exists
          if [ -d "migrations" ]; then
            cp -r migrations deploy/
          else
            mkdir -p deploy/migrations
          fi
          
          # Create tarball
          cd deploy
          tar -czf ../wellasset-deploy.tar.gz .
          cd ..
          
          echo "Deployment package created: wellasset-deploy.tar.gz"
          ls -lh wellasset-deploy.tar.gz
      
      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          # Setup SSH
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          
          # Add EC2 host to known_hosts
          ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts
          
          # Upload deployment package
          echo "Uploading deployment package..."
          scp -i ~/.ssh/deploy_key wellasset-deploy.tar.gz ${EC2_USER}@${EC2_HOST}:/tmp/
          
          # Execute deployment script
          echo "Executing deployment script..."
          ssh -i ~/.ssh/deploy_key ${EC2_USER}@${EC2_HOST} 'bash -s' < deploy.sh
      
      - name: Verify deployment
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          echo "Verifying deployment..."
          sleep 10
          
          # Check health endpoint
          if curl -f http://$EC2_HOST/health; then
            echo "✅ Deployment successful! Application is healthy."
          else
            echo "❌ Deployment verification failed"
            exit 1
          fi
      
      - name: Notify deployment status
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ Deployment to EC2 successful!"
          else
            echo "❌ Deployment to EC2 failed!"
          fi
