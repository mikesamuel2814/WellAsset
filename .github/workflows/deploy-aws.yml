name: Deploy to AWS

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: choice
        options:
          - staging
          - production

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: wellasset-realestate
  CODEDEPLOY_APPLICATION: wellasset-app
  CODEDEPLOY_DEPLOYMENT_GROUP: wellasset-deployment-group
  S3_BUCKET: wellasset-codedeploy-artifacts

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: 
      name: ${{ github.event.inputs.environment || 'production' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
      
      - name: Run database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: production
        run: |
          npm ci
          npm run db:push
      
      - name: Create deployment package
        run: |
          # Create a clean directory for deployment
          mkdir -p deployment
          
          # Copy deployment files
          cp appspec.yml deployment/
          cp -r scripts deployment/
          
          # Create a file with the image tag for EC2 instances to use
          echo "${{ github.sha }}" > deployment/IMAGE_TAG
          
          # Create deployment archive
          cd deployment
          zip -r ../deployment.zip .
          cd ..
          
          echo "Deployment package created: deployment.zip"
      
      - name: Upload deployment package to S3
        run: |
          aws s3 cp deployment.zip s3://${{ env.S3_BUCKET }}/wellasset-${{ github.sha }}.zip
          echo "Deployment package uploaded to S3"
      
      - name: Create CodeDeploy deployment
        id: deploy
        run: |
          DEPLOYMENT_ID=$(aws deploy create-deployment \
            --application-name ${{ env.CODEDEPLOY_APPLICATION }} \
            --deployment-group-name ${{ env.CODEDEPLOY_DEPLOYMENT_GROUP }} \
            --s3-location bucket=${{ env.S3_BUCKET }},key=wellasset-${{ github.sha }}.zip,bundleType=zip \
            --description "Deployment for commit ${{ github.sha }}" \
            --query 'deploymentId' \
            --output text)
          
          echo "deployment-id=$DEPLOYMENT_ID" >> $GITHUB_OUTPUT
          echo "Deployment created: $DEPLOYMENT_ID"
      
      - name: Wait for deployment to complete
        env:
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment-id }}
        run: |
          echo "Waiting for deployment $DEPLOYMENT_ID to complete..."
          
          aws deploy wait deployment-successful \
            --deployment-id $DEPLOYMENT_ID \
            --region ${{ env.AWS_REGION }} \
            --cli-read-timeout 900
          
          echo "Deployment completed successfully!"
      
      - name: Get deployment status
        if: always()
        env:
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment-id }}
        run: |
          if [ -n "$DEPLOYMENT_ID" ]; then
            aws deploy get-deployment \
              --deployment-id $DEPLOYMENT_ID \
              --query 'deploymentInfo.status' \
              --output text
          fi
      
      - name: Notify deployment status
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ Deployment successful!"
          else
            echo "❌ Deployment failed!"
          fi
